# 发布 GitHub Release 时，经 npm Trusted Publishing（OIDC）把包发布到 npm，不需要令牌和 2FA。
# npm 上的 Trusted Publisher 配置写的是这个文件名，改名要同时在 npm 上删掉旧配置、重建。
name: 发布到 npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      # Trusted Publishing 需要 npm 11.5.1 或更高版本。
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: 检查 Release 标签和 package.json 的版本一致
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "Release 标签是 $TAG，package.json 里的版本是 $version" >&2
            exit 1
          fi
      - run: npm publish
