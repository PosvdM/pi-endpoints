<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="endpoints-token" content="__TOKEN__">
<title>pi-endpoints</title>
<style>
:root {
	color-scheme: light dark;
	--bg: #f5f6f8; --panel: #fff; --subtle: #f0f1f4; --hover: #f6f7fa; --text: #17181c; --muted: #6b7080; --faint: #9a9eab;
	--line: #e3e5ea; --line-strong: #d3d6dd; --accent: #3a66f0; --accent-soft: #e9eefe; --accent-text: #2a52cf;
	--danger: #d03b31; --danger-soft: #fdecea; --ok: #1d8a4f; --ok-soft: #e6f4ec; --warn: #b5650a; --warn-soft: #fdf1e1;
	--pi: #7a64d8; --shadow: 0 10px 40px rgba(20, 22, 30, .14), 0 2px 8px rgba(20, 22, 30, .06);
	--mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) {
	:root {
		--bg: #0e0f11; --panel: #16171a; --subtle: #1d1f23; --hover: #1b1d21; --text: #e7e8eb; --muted: #8d919c; --faint: #636774;
		--line: #26282d; --line-strong: #33363c; --accent: #6b8fff; --accent-soft: #1e2640; --accent-text: #9ab2ff;
		--danger: #ff6f63; --danger-soft: #3a1c1a; --ok: #4cc283; --ok-soft: #15291e; --warn: #eaa74a; --warn-soft: #33250f;
		--pi: #a796ff; --shadow: 0 10px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
	}
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; font: 13.5px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--mono); }

/* 布局 */
.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.brand { padding: 16px 18px 14px; display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--text); color: var(--panel); display: grid; place-items: center; font: 600 13px var(--mono); }
.brand b { font-size: 14px; font-weight: 600; }
.side-label { padding: 10px 18px 6px; font-size: 11.5px; color: var(--faint); letter-spacing: .04em; }
.services { flex: 1; overflow: auto; padding: 0 10px; }
.svc { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; }
.svc:hover { background: var(--hover); }
.svc.active { background: var(--subtle); }
.svc .meta { flex: 1; min-width: 0; }
.svc .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.svc .sub { font-size: 12px; color: var(--muted); }
.svc-sep { height: 1px; background: var(--line); margin: 6px 10px; }
.side-foot { padding: 12px 10px 14px; border-top: 1px solid var(--line); }
.side-foot p { margin: 10px 8px 0; font-size: 11.5px; color: var(--faint); }
.version { display: flex; align-items: center; gap: 5px; font-family: var(--mono); }
.version:empty { display: none; }
.update { display: inline-flex; color: var(--ok); }
.update:hover { filter: brightness(1.1); }
main { overflow: auto; min-width: 0; }
.page { max-width: 1240px; margin: 0 auto; padding: 22px 32px 48px; }

/* 状态点 */
.status { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.status.on { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.status.err { background: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }

/* 服务标题 */
.head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
.head .info { flex: 1; min-width: 0; }
.head h1 { margin: 0; font-size: 20px; font-weight: 650; display: flex; align-items: center; gap: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 6px; color: var(--muted); font-size: 12.5px; }
.facts .mono { color: var(--text); font-size: 12px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--subtle); color: var(--muted); }
.pill.on { background: var(--ok-soft); color: var(--ok); }
.pill.err { background: var(--danger-soft); color: var(--danger); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

/* 按钮和输入 */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 13px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); cursor: pointer; white-space: nowrap; font-weight: 500; }
.btn:hover:not(:disabled) { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.ghost { border-color: transparent; background: none; }
.btn.small { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.block { width: 100%; justify-content: center; }
.input, select.input, textarea.input { height: 32px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--panel); width: 100%; outline: none; }
textarea.input { height: auto; min-height: 64px; padding: 7px 10px; font: 12px/1.5 var(--mono); resize: vertical; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input::placeholder { color: var(--faint); }

/* 提示 */
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.banner.err { background: var(--danger-soft); color: var(--danger); }
.banner.warn { background: var(--warn-soft); color: var(--warn); align-items: center; }
.banner .grow { flex: 1; }
.toast { position: fixed; right: 24px; bottom: 24px; padding: 9px 16px; border-radius: 10px; background: var(--text); color: var(--panel); font-size: 13px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); transition: .18s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; transform: none; }

/* 标签页 */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.tab { border: 0; background: none; padding: 9px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.tab .count { margin-left: 6px; font-size: 11.5px; color: var(--faint); font-weight: 400; }

/* 工具栏 */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.search { position: relative; width: 260px; }
.search svg { position: absolute; left: 10px; top: 9px; color: var(--faint); }
.search .input { padding-left: 32px; }
.toolbar select.input { width: auto; min-width: 128px; }
.check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; user-select: none; }
.spacer { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; margin: 10px 2px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* 模型表 */
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.table-wrap + .table-wrap { margin-top: 16px; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--subtle); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
tbody tr:last-child td { border-bottom: 0; }
td.toggle { overflow: visible; text-overflow: clip; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--hover); }
tbody tr.open td { background: var(--accent-soft); }
tr.group td { background: var(--subtle) !important; padding: 7px 12px; font-size: 12px; color: var(--muted); user-select: none; }
tr.group:hover td { color: var(--text); }
tr.group .caret { display: inline-flex; width: 18px; vertical-align: -2px; color: var(--muted); transition: transform .12s; }
tr.group.collapsed .caret { transform: rotate(-90deg); }
tr.group b { color: var(--text); font-weight: 600; font-size: 12.5px; margin-right: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { height: 26px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; font: 12.5px var(--mono); color: var(--muted); }
.chip:hover { color: var(--text); border-color: var(--line-strong); }
.chip.active { background: var(--text); border-color: var(--text); color: var(--panel); }
.chip .n { margin-left: 5px; opacity: .65; font-family: system-ui, sans-serif; }
.model-id { font: 500 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; }
/* id 过长时只截断 id 本身，星标和标签留在行内可见。 */
td .model-id { display: flex; align-items: center; }
td .model-id > .id { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
td .model-id > :not(.id) { flex: none; }
.model-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.num { font-variant-numeric: tabular-nums; }
.val { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; }
.val > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.src { width: 6px; height: 6px; border-radius: 50%; flex: none; }
.src.server { background: var(--ok); }
.src.pi { background: var(--pi); }
.src.manual { background: var(--accent); }
.src.default { background: var(--warn); }
.api { font: 11.5px var(--mono); padding: 1px 7px; border-radius: 6px; background: var(--subtle); color: var(--muted); }
.levels { font-size: 12px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 5px; background: var(--subtle); color: var(--muted); margin-left: 6px; vertical-align: 1px; font-family: system-ui, sans-serif; font-weight: 500; }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.accent { background: var(--accent-soft); color: var(--accent-text); }
.star { border: 0; background: none; padding: 0 2px; margin-left: 4px; font-size: 14px; line-height: 0; color: var(--faint); cursor: pointer; vertical-align: -2px; }
.star:not([aria-disabled]):hover { color: var(--warn); }
.star[aria-disabled] { cursor: default; }
.star.on { color: var(--warn); }
.star.on:hover { opacity: .6; }
.star.off { opacity: 0; }
tr:hover .star.off, .star.off:focus-visible, .drawer-head .star.off { opacity: 1; }
.drawer-head .star { font-size: 18px; margin: 2px 4px 0 0; }
.warn { color: var(--warn); }
.empty { padding: 56px 0; text-align: center; color: var(--muted); }

/* 开关 */
.switch { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 999px; background: var(--line-strong); position: relative; cursor: pointer; transition: background .15s; margin: 0; vertical-align: middle; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(12px); }

/* 卡片和表单 */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; max-width: 760px; }
.card h3 { margin: 0 0 14px; font-size: 14px; font-weight: 600; }
.card.danger { border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
.form { display: grid; grid-template-columns: 128px 1fr; gap: 14px 16px; align-items: start; }
.form > label { padding-top: 6px; color: var(--muted); }
.hint { font-size: 12px; color: var(--muted); margin-top: 5px; }
.actions { display: flex; gap: 8px; align-items: center; margin-top: 18px; }
.key-row { display: flex; gap: 8px; }

/* 详情抽屉 */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .28); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 11; display: flex; flex-direction: column; }
.drawer-head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
.drawer-head .grow { flex: 1; min-width: 0; }
.drawer-head .model-id { font-size: 14px; white-space: normal; word-break: break-all; }
.drawer-body { flex: 1; overflow: auto; padding: 18px 22px 28px; }
.drawer-foot { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.section-title { font-size: 12px; color: var(--faint); letter-spacing: .04em; margin: 22px 0 10px; }
#drawer-error + .section-title { margin-top: 0; }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 7px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; word-break: break-word; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.srctext { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.drawer .form { grid-template-columns: 96px 1fr; gap: 12px 14px; }
.result { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.err { background: var(--danger-soft); color: var(--danger); }
.close { width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
.close:hover { background: var(--hover); color: var(--text); }
</style>
</head>
<body>
<div class="app">
	<aside>
		<div class="brand"><div class="logo">π</div><b>pi-endpoints</b></div>
		<div class="side-label">服务</div>
		<div class="services" id="services"></div>
		<div class="side-foot">
			<button class="btn block" id="add">＋ 添加服务</button>
			<p>修改会立即保存并在 pi 里生效</p>
			<p class="version" id="version"></p>
		</div>
	</aside>
	<main><div class="page" id="content"></div></main>
</div>
<div id="drawer"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const TOKEN = document.querySelector('meta[name="endpoints-token"]').content;
const SOURCE = { manual: "手动", server: "服务端", pi: "pi 自带", default: "默认值", native_endpoints: "native_endpoints", owned_by: "owned_by", name: "按名字" };
const LONG_CONTEXT_BETA = "context-1m-2025-08-07";
let state = { services: [], apis: [] };
let current = null; // 当前服务名；"" 表示新建
let tab = "models";
let openModel = null;
const view = { text: "", api: "", owner: "", hidden: false, prefix: "" };
const ENABLED = " enabled"; // view.prefix 取这个值时只看已启用的模型
const collapsed = new Set(); // 折叠的前缀分组
// 服务名 → 点"已启用"按钮时已启用的模型 id。这一页只列这些：停用的先留着，方便改回来，再点一次按钮或刷新页面后移走。
const pinned = new Map();
// 服务名 → 打开页面时这个服务是否停用。左栏按这份记录把停用的服务排在下面：切换开关后服务先留在原处，方便改回来，刷新页面后再挪。
const parked = new Map();
const CARET = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

/**
 * 模型名里的版本号，用来把新模型排在前面：gpt-6.1-sol → [6, 1]，claude-opus-4-6-thinking → [4, 6]，
 * qwen3-coder → [3]，gpt-4o → [4]。120b、9B 这类参数规模，以及 2024-08-06、20250929 这类日期不算版本号；
 * 没有版本号时返回空数组。
 */
function versionOf(id) {
	const parts = id.slice(id.lastIndexOf("/") + 1).toLowerCase().split("-");
	const version = [];
	const lead = parts[0].match(/\d+(?:\.\d+)*$/);
	if (lead) version.push(...lead[0].split(".").map(Number));
	for (const part of parts.slice(1)) {
		// 版本号最多三位数字，可以带一个字母后缀（4o），但 b、k、m 是参数规模（120b）。
		const match = /^v?(\d{1,3}(?:\.\d+)*)([a-z]?)$/.exec(part);
		if (match && !"bkm".includes(match[2] || "-")) version.push(...match[1].split(".").map(Number));
		else if (version.length) break;
	}
	return version;
}

// 版本号大的在前，版本号相同时按名字排序，没有版本号的放最后。
function newestFirst(a, b) {
	const va = versionOf(a.id);
	const vb = versionOf(b.id);
	for (let i = 0; i < Math.max(va.length, vb.length); i++) {
		const diff = (vb[i] ?? -1) - (va[i] ?? -1);
		if (diff) return diff;
	}
	return a.id.localeCompare(b.id);
}

// 模型 id 的前缀：去掉 / 之前的部分，取第一段，去掉末尾的版本号，如 gpt-6.1-sol → gpt、qwen3-coder → qwen。
function prefixOf(id) {
	const head = id.slice(id.lastIndexOf("/") + 1).split(/[-_.]/)[0].replace(/\d+$/, "").toLowerCase();
	return head || "其他";
}

// 分组和前缀按钮的顺序：这几家按固定顺序排在前面，其余前缀按字母序排在后面。
const PREFIX_ORDER = ["gpt", "claude", "gemini", "grok"];
function byPrefix(a, b) {
	const rank = (prefix) => (PREFIX_ORDER.includes(prefix) ? PREFIX_ORDER.indexOf(prefix) : PREFIX_ORDER.length);
	return rank(a) - rank(b) || a.localeCompare(b);
}
let error = null;
let toastTimer;
let serviceDraft = null; // 服务表单里还没保存的内容：{ key: 服务名，新建时为 "", nameTouched, values }
const refreshing = new Set(); // 正在刷新目录的服务名
let stale = false; // 后台刷新改了 state，还没重画
let pointerDown = false;

const $ = (sel, root = document) => root.querySelector(sel);
function h(tag, attrs = {}, ...children) {
	const el = document.createElement(tag);
	for (const [key, value] of Object.entries(attrs)) {
		if (value === undefined || value === null || value === false) continue;
		if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
		else if (key === "class") el.className = value;
		else if (key === "value") el.value = value;
		else if (key === "html") el.innerHTML = value;
		else if (value === true) el.setAttribute(key, "");
		else el.setAttribute(key, value);
	}
	for (const child of children.flat()) {
		if (child === undefined || child === null || child === false) continue;
		el.append(child instanceof Node ? child : document.createTextNode(String(child)));
	}
	return el;
}

// 协议和 owned_by 那类来源只在详情里显示文字，表格里只用颜色点表示参数来源。
const dot = (source) => h("span", { class: `src ${source}`, title: SOURCE[source] ?? source });
const srcText = (source, label) => h("span", { class: "srctext" }, ["server", "pi", "manual", "default"].includes(source) ? dot(source) : null, label ?? SOURCE[source] ?? source);

function short(n) {
	if (typeof n !== "number") return "";
	const trim = (value, digits) => String(Number(value.toFixed(digits)));
	if (n >= 1e6) return `${trim(n / 1e6, 2)}M`;
	if (n >= 1e3) return `${trim(n / 1e3, 1)}K`;
	return String(n);
}
const full = (n) => (typeof n === "number" ? n.toLocaleString() : "");

async function api(path, body) {
	const response = await fetch(`/api/${path}`, {
		method: body === undefined ? "GET" : "POST",
		headers: { "x-endpoints-token": TOKEN, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
		body: body === undefined ? undefined : JSON.stringify(body),
	});
	const data = await response.json().catch(() => ({ error: `服务器返回 ${response.status}` }));
	if (!response.ok) throw new Error(data.error || `服务器返回 ${response.status}`);
	return data;
}

async function run(path, body, okText) {
	try {
		const data = await api(path, body);
		if (data.services) state = data;
		error = data.refreshError ? `刷新失败：${data.refreshError}` : null;
		render();
		refreshDrawerStar();
		$("#drawer-error")?.replaceChildren();
		if (okText && !data.refreshError) toast(okText);
		return data;
	} catch (failure) {
		error = failure.message;
		render();
		// 详情面板盖住了页面顶部的错误提示，在面板里也显示一份。
		$("#drawer-error")?.replaceChildren(h("div", { class: "banner err" }, failure.message));
		return undefined;
	}
}

// 文字输入框有焦点时不重画：重画会让它失去焦点，还会清掉没保存的密钥。
const typing = () => document.activeElement?.matches("textarea, select, input:not([type=checkbox]):not([type=radio])") ?? false;

// 后台刷新的结果等到没在输入、也没按着鼠标时再画，免得点击落在被替换掉的元素上。
function flush() {
	if (!stale || pointerDown || typing()) return;
	stale = false;
	render();
	refreshDrawerStar();
}
document.addEventListener("pointerdown", () => { pointerDown = true; }, true);
// 等这次点击处理完再画。
document.addEventListener("pointerup", () => { pointerDown = false; setTimeout(flush); }, true);
document.addEventListener("focusout", () => setTimeout(flush));

/** 在后台刷新目录，用在打开页面和重新启用服务时。失败原因记在服务状态里，不弹顶部提示。 */
async function refreshInBackground(name) {
	if (refreshing.has(name)) return;
	refreshing.add(name);
	stale = true;
	flush();
	try {
		const data = await api("refresh", { name });
		if (data.services) state = data;
	} catch {
		// 连不上管理页本身（如 pi 已退出）时不打扰，手动刷新会显示原因。
	} finally {
		refreshing.delete(name);
		stale = true;
		flush();
	}
}

function toast(text) {
	const el = $("#toast");
	el.textContent = text;
	el.classList.add("show");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

const service = () => state.services.find((item) => item.name === current);

// 左栏的两组服务：[启用的, 停用的]，组内保持配置文件里的顺序。打开页面后新加的服务按加入时的状态归组。
function serviceGroups() {
	for (const item of state.services) if (!parked.has(item.name)) parked.set(item.name, Boolean(item.status?.disabled));
	return [state.services.filter((item) => !parked.get(item.name)), state.services.filter((item) => parked.get(item.name))];
}
const firstService = () => serviceGroups().flat()[0]?.name ?? "";
const statusClass = (item) => (item.status?.disabled ? "" : item.status?.error ? "err" : item.status?.registered ? "on" : "");

function parseJsonField(text, label) {
	const trimmed = text.trim();
	if (!trimmed) return undefined;
	try {
		const value = JSON.parse(trimmed);
		if (typeof value !== "object" || value === null || Array.isArray(value)) throw new Error();
		return value;
	} catch {
		throw new Error(`${label} 要填 JSON 对象，例如 {"key": "value"}`);
	}
}

function positiveInt(text, label) {
	const value = Number(text);
	if (!Number.isInteger(value) || value <= 0) throw new Error(`${label} 要填正整数`);
	return value;
}

function select(item) {
	current = item;
	tab = "models";
	// 筛选条件按服务各自的模型生成，换服务后不再适用。
	Object.assign(view, { api: "", owner: "", prefix: "" });
	openModel = null;
	error = null;
	serviceDraft = null;
	render();
}

function renderNav() {
	const [on, off] = serviceGroups();
	const row = (item) =>
		// 按钮里不能放开关，所以用 div 模拟按钮。
		h("div", { class: `svc${item.name === current ? " active" : ""}`, role: "button", tabindex: "0", onclick: () => select(item.name), onkeydown: (event) => {
			if (event.target === event.currentTarget && (event.key === "Enter" || event.key === " ")) {
				event.preventDefault();

			}
		} },
			h("span", { class: `status ${statusClass(item)}` }),

			),
			h("input", { type: "checkbox", class: "switch", title: item.status?.disabled ? "启用服务" : "停用服务", checked: item.status?.disabled ? undefined : true, onclick: (event) => event.stopPropagation(), onchange: async (event) => {
				const disabled = !event.target.checked;

/* ---------- 服务标题 ---------- */

function renderHead(item) {
	const status = item.status;
	const pill = status?.disabled ? h("span", { class: "pill" }, "已停用") : status?.error ? h("span", { class: "pill err" }, "有错误") : status?.registered ? h("span", { class: "pill on" }, "已注册到 pi") : h("span", { class: "pill" }, "未注册");

/* ---------- 模型列表 ---------- */

function matches(model) {
	const text = view.text.trim().toLowerCase();
	if (text && !model.id.toLowerCase().includes(text) && !model.name.value.toLowerCase().includes(text)) return false;
	if (view.api && model.api.value !== view.api) return false;
	if (view.owner && (model.ownedBy ?? "") !== view.owner) return false;
	if (!view.hidden && model.hidden && !model.enabled) return false;
	return true;
}

function renderModels(item) {
	const wrap = h("div");
	const options = (values, all) => [h("option", { value: "" }, all), ...[...new Set(values)].sort().map((value) => h("option", { value }, value || "（空）"))];
	const apiFilter = h("select", { class: "input", onchange: (event) => { view.api = event.target.value; renderTable(); } }, options(item.models.map((model) => model.api.value), "全部协议"));
	apiFilter.value = view.api;
	const ownerFilter = h("select", { class: "input", onchange: (event) => { view.owner = event.target.value; renderTable(); } }, options(item.models.map((model) => model.ownedBy ?? ""), "全部 owned_by"));
	ownerFilter.value = view.owner;
	const search = h("input", { class: "input", type: "search", value: view.text, placeholder: "搜索模型 id 或名称", oninput: (event) => { view.text = event.target.value; renderTable(); } });
	const count = h("span", { class: "hint", style: "margin:0" });
	const chips = h("div", { class: "chips" });
	wrap.append(h("div", { class: "toolbar" },
		h("div", { class: "search" }, h("span", { html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>' }), search),
		apiFilter, ownerFilter,
		h("label", { class: "check" }, h("input", { type: "checkbox", checked: view.hidden || undefined, onchange: (event) => { view.hidden = event.target.checked; renderTable(); } }), "显示隐藏模型"),
		h("span", { class: "spacer" }),
		count,
	));
	const box = h("div");
	wrap.append(chips, box, h("div", { class: "legend" },
		h("span", {}, "参数来源："), ...["server", "pi", "manual", "default"].map((source) => h("span", {}, dot(source), SOURCE[source])),
		h("span", { class: "spacer" }), h("span", {}, "点击查看详情和手动设置"),
	));


	function renderChips(models) {
		const counts = new Map();
		for (const model of models) counts.set(prefixOf(model.id), (counts.get(prefixOf(model.id)) ?? 0) + 1);
		const chip = (value, label, n) => h("button", { class: `chip${view.prefix === value ? " active" : ""}`, onclick: () => {
			if (value === ENABLED) pinned.set(item.name, new Set(item.models.filter((model) => model.enabled).map((model) => model.id)));
			view.prefix = value;
			renderTable();
		} }, label, h("span", { class: "n" }, n));
		chips.replaceChildren(
			chip("", "全部", models.length),
			chip(ENABLED, "已启用", models.filter((model) => model.enabled).length),
			...[...counts].sort(([a], [b]) => byPrefix(a, b)).map(([prefix, n]) => chip(prefix, prefix, n)),
		);
	}

	function renderTable() {
		// 前缀按钮上的数量按其他筛选条件计算，不受当前所选前缀影响。
		const filtered = item.models.filter(matches);
		renderChips(filtered);
		if (view.prefix === ENABLED && !pinned.has(item.name)) pinned.set(item.name, new Set(item.models.filter((model) => model.enabled).map((model) => model.id)));
		const models = filtered.filter((model) =>
			!view.prefix || (view.prefix === ENABLED ? pinned.get(item.name).has(model.id) : prefixOf(model.id) === view.prefix));
		count.textContent = `显示 ${models.length} / ${item.models.length}`;
		if (models.length === 0) {
			const empty = !item.models.length ? (item.status?.keySource ? "目录是空的。点“刷新目录”重新读取。" : "目录是空的。设置好密钥后点“刷新目录”。") : view.prefix === ENABLED && !item.models.some((model) => model.enabled) ? "还没有启用模型" : "没有符合条件的模型";
			box.replaceChildren(h("div", { class: "table-wrap" }, h("div", { class: "empty" }, empty)));
			return;
		}
		const groups = new Map();
		for (const model of models) {
			const prefix = prefixOf(model.id);
			if (!groups.has(prefix)) groups.set(prefix, []);
			groups.get(prefix).push(model);
		}
		const cards = [];
		const section = (key, title, list, summary) => {
			const rows = [];
			cards.push(rows);
			const id = `${item.name}/${key}`;
			const closed = collapsed.has(id);
			rows.push(h("tr", { class: `group${closed ? " collapsed" : ""}`, onclick: () => {
				if (closed) collapsed.delete(id);
				else collapsed.add(id);
				renderTable();
			} }, h("td", { colspan: 7 }, h("span", { class: "caret", html: CARET }), h("b", {}, title), summary)));
			if (!closed) rows.push(...list.map((model) => modelRow(item, model)));
		};
		for (const [prefix, list] of [...groups].sort(([a], [b]) => byPrefix(a, b))) {
			list.sort(newestFirst);
			const enabled = list.filter((model) => model.enabled).length;
			section(prefix, prefix, list, `${list.length} 个${enabled ? `，已启用 ${enabled}` : ""}`);
		}
		// 每个分组单独放一张表，彼此隔开。各表列宽相同，表头只放在第一张上。
		const table = (body, withHead) => h("div", { class: "table-wrap" }, h("table", {},
			h("colgroup", {}, ...["58px", "", "176px", "88px", "88px", "220px", "100px"].map((width) => h("col", width ? { style: `width:${width}` } : {}))),
			withHead ? h("thead", {}, h("tr", {}, ...["", "模型", "协议", "上下文", "最大输出", "思考档位", "owned_by"].map((title) => h("th", {}, title)))) : null,
			h("tbody", {}, body),
		));
		box.replaceChildren(...cards.map((body, index) => table(body, index === 0)));
	}
	renderTable();
	return wrap;
}

const isDefault = (item, model) => state.defaultModel?.provider === item.name && state.defaultModel.id === model.id;

// 详情面板不随 render() 重建，免得冲掉没保存的输入，这里单独更新星标。

// 用 SVG 画星，字符 ★ 在部分系统上显示成彩色 emoji，颜色不受 CSS 控制。
const UPDATE_ICON = '<svg viewBox="0 0 16 16" width="14" height="14"><circle cx="8" cy="8" r="8" fill="currentColor"/><path d="M8 11.5v-7M5 7.5l3-3 3 3" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR = (filled) => `<svg viewBox="0 0 24 24" width="1em" height="1em" fill="${filled ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.8l2.8 5.8 6.4.9-4.6 4.5 1.1 6.3L12 17.3l-5.7 3 1.1-6.3-4.6-4.5 6.4-.9z"/></svg>`;

/**
 * 实心星是 pi 的默认模型，点击取消；没注册到 pi 时变灰。空心星设为默认，在列表里悬停才显示。
 * 点不了的星不用 disabled：禁用的按钮会吞掉点击，列表行就打不开详情了。
 */
function star(item, model) {
	const usable = model.enabled && item.status?.registered;
	if (isDefault(item, model)) {
		const title = usable ? "pi 默认模型，点击取消" : "pi 默认模型，但它现在没有注册到 pi，pi 启动时会改用别的模型。点击取消";
		return h("button", { class: `star${usable ? " on" : ""}`, title, onclick: async (event) => {
			event.stopPropagation();
			await run("clearDefaultModel", {}, "已取消 pi 默认模型，运行中的 pi 需执行 /reload");
		}, html: STAR(true) });
	}
	if (!usable) {
		const title = !model.enabled ? "先启用这个模型，才能设为 pi 默认模型" : "服务没有注册到 pi，不能设为默认模型";
		return h("button", { class: "star off", title, "aria-disabled": "true", html: STAR(false) });
	}
	return h("button", { class: "star off", title: "设为 pi 默认模型", onclick: async (event) => {
		event.stopPropagation();
		await run("setDefaultModel", { name: item.name, id: model.id }, "已设为 pi 默认模型，运行中的 pi 需执行 /reload");
	}, html: STAR(false) });
}

	headers.value = o.headers ? JSON.stringify(o.headers, null, 2) : "";
	field("请求头", headers, "Anthropic 协议的 anthropic-beta 会追加到 pi 自己的 beta 列表里");
	const compat = h("textarea", { class: "input", placeholder: "自动：按原厂从 pi 自带目录抄" });
	compat.value = o.compat ? JSON.stringify(o.compat, null, 2) : "";
	field("compat", compat);
	const cost = h("textarea", { class: "input", placeholder: '每百万 token 的美元价格，例如 {"input": 2, "output": 10}' });
	cost.value = o.cost ? JSON.stringify(o.cost, null, 2) : "";
	field("价格", cost);

	const result = h("div");
	const testButton = h("button", { class: "btn", onclick: async () => {
		testButton.disabled = true;
		testButton.textContent = "测试中…";
		try {
			const data = await api("testModel", { name: item.name, id: model.id });
			const test = data.test;
			result.replaceChildren(h("div", { class: `result ${test.ok ? "ok" : "err"}` },
				`${test.ok ? "成功" : "失败"} · ${test.request.api} ${test.request.baseUrl} · ${(test.durationMs / 1000).toFixed(1)} 秒 · stopReason: ${test.stopReason}\n`,
				test.ok ? `回复：${test.text}` : test.error || "没有返回错误信息"));
		} catch (failure) {
			result.replaceChildren(h("div", { class: "result err" }, failure.message));
		} finally {
			testButton.disabled = false;
			testButton.textContent = "发送测试消息";
		}
	} }, "发送测试消息");

	const save = async () => {
		let override;
		try {
			override = {};
			if (name.value.trim()) override.name = name.value.trim();
			if (apiSelect.value) override.api = apiSelect.value;
			if (baseUrl.value.trim()) override.baseUrl = baseUrl.value.trim().replace(/\/+$/, "");
			if (ctx.value) override.contextWindow = positiveInt(ctx.value, "上下文");
			if (max.value) override.maxTokens = positiveInt(max.value, "最大输出");
			if (input.value) override.input = input.value.split(",");
			if (levels.value.trim()) {
				const list = levels.value.split(/[\s,，]+/).map((level) => level.trim().toLowerCase()).filter(Boolean);
				override.thinkingLevels = list.length === 1 && list[0] === "none" ? [] : list;
			}
			const parsedHeaders = parseJsonField(headers.value, "请求头");
			if (parsedHeaders) override.headers = parsedHeaders;
			const parsedCompat = parseJsonField(compat.value, "compat");
			if (parsedCompat) override.compat = parsedCompat;
			const parsedCost = parseJsonField(cost.value, "价格");
			if (parsedCost) override.cost = { input: 0, output: 0, cacheRead: 0, cacheWrite: 0, ...parsedCost };
		} catch (failure) {
			result.replaceChildren(h("div", { class: "result err" }, failure.message));
			return;
		}
		if (await run("setOverride", { name: item.name, id: model.id, override }, "手动设置已保存")) renderDrawer();
	};

	return [
		h("div", { class: "drawer-body" },
			h("div", { id: "drawer-error" }),
			h("div", { class: "section-title" }, "生效的参数"),
			effective,
			h("div", { class: "section-title" }, "手动设置 · 留空的项自动取值"),
			form,
			result,
		),
		h("div", { class: "drawer-foot" },
			h("button", { class: "btn primary", onclick: save }, "保存"),
			h("button", { class: "btn", disabled: Object.keys(o).length ? undefined : true, onclick: async () => {
				if (await run("setOverride", { name: item.name, id: model.id }, "已清除手动设置")) renderDrawer();
			} }, "清除手动设置"),
			h("span", { class: "spacer" }),
			testButton,
		),
	];
}

/* ---------- 服务设置 ---------- */

// 服务名：小写字母、数字、点、下划线和连字符，以字母或数字开头。显示名里的其他字符换成连字符。
function slugify(text) {
	return text.toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/-{2,}/g, "-").replace(/^[^a-z0-9]+|-+$/g, "");
}

function renderServiceForm(item) {
	const isNew = !item;
	const key = item?.name ?? "";
	// 出错时整页会重画，表单从 serviceDraft 恢复已填的内容，没有草稿时用已保存的值。
	const saved = serviceDraft?.key === key ? serviceDraft.values : {
		name: item?.name ?? "",
		displayName: item?.displayName ?? "",
		baseUrl: item?.baseUrl ?? "",
		defaultApi: item?.defaultApi ?? "",
		apiKey: "",
		apiKeyEnv: item?.apiKeyEnv ?? "",
		headers: item && Object.keys(item.headers).length ? JSON.stringify(item.headers, null, 2) : "",
	};
	// 添加服务时，名字跟着显示名生成，直到用户自己改名字；把名字清空后重新跟随。
	let nameTouched = serviceDraft?.key === key ? serviceDraft.nameTouched : false;
	const remember = () => {
		serviceDraft = { key, nameTouched, values: { name: name.value, displayName: displayName.value, baseUrl: baseUrl.value, defaultApi: defaultApi.value, apiKey: apiKey?.value ?? "", apiKeyEnv: apiKeyEnv.value, headers: headers.value } };
	};
	const card = h("div", { class: "card" }, h("h3", {}, isNew ? "添加服务" : "服务"));
	const form = h("div", { class: "form", oninput: remember, onchange: remember });
	const field = (label, input, hint) => form.append(h("label", {}, label), h("div", {}, input, hint ? h("div", { class: "hint" }, hint) : null));
	const displayName = h("input", { class: "input", type: "text", value: saved.displayName, placeholder: "可选，显示在 pi 的模型列表里", oninput: () => {
		if (isNew && !nameTouched) name.value = slugify(displayName.value);
	} });
	const name = h("input", { class: "input", type: "text", value: saved.name, placeholder: "cpa",
		oninput: () => { nameTouched = name.value !== ""; },
		onblur: () => { name.value = name.value.trim().toLowerCase(); remember(); } });
	const baseUrl = h("input", { class: "input", type: "text", value: saved.baseUrl, placeholder: "https://example.com" });
	const defaultApi = h("select", { class: "input" }, h("option", { value: "" }, "openai-completions（默认）"), ...state.apis.map((value) => h("option", { value }, value)));
	defaultApi.value = saved.defaultApi;
	// 已有服务的密钥在单独的密钥卡片里改，表单里只有添加服务时才有密钥框。
	const apiKey = isNew ? keyInput("可选，用环境变量提供密钥时可以不填") : null;
	if (apiKey) apiKey.value = saved.apiKey;
	const apiKeyEnv = h("input", { class: "input", type: "text", value: saved.apiKeyEnv, placeholder: "可选，例如 CPA_API_KEY" });
	const headers = h("textarea", { class: "input", placeholder: '可选，例如 {"X-Title": "pi"}' });
	headers.value = saved.headers;
	field("显示名", displayName);
	field("名字", name, `pi 里的服务商名，模型写成 名字/模型 id。只能用小写字母、数字、点、下划线和连字符。${isNew ? "默认按显示名生成，可以修改。" : ""}`);
	field("地址", baseUrl, "服务根地址，不带 /v1");
	if (apiKey) field("密钥", apiKey, "只保存在本机，页面不会再显示");
	field("密钥环境变量", apiKeyEnv, "设置了这个环境变量时优先用它");
	field("默认协议", defaultApi, "协议按模型分别判断，同一服务可混用多种协议，无需按协议拆分。仅无法判断时使用此项。");
	field("请求头", headers, "加在这个服务所有请求上，按原样发送。Anthropic 协议的 anthropic-beta 会追加到 pi 自己的 beta 列表里");
	const submit = h("button", { class: "btn primary", onclick: async () => {
		let parsedHeaders;
		try { parsedHeaders = parseJsonField(headers.value, "请求头"); } catch (failure) { error = failure.message; render(); return; }
		// 添加服务时还要读取目录，最长等到超时。请求期间禁用按钮，免得重复提交；run() 结束后整页重画，按钮随之恢复。
		submit.disabled = true;
		submit.textContent = isNew ? "添加中…" : "保存中…";
		const body = { previousName: item?.name, apiKey: apiKey?.value, service: { name: name.value.trim().toLowerCase(), displayName: displayName.value, baseUrl: baseUrl.value, defaultApi: defaultApi.value, apiKeyEnv: apiKeyEnv.value, headers: parsedHeaders ?? {} } };
		if (await run("saveService", body, isNew ? "已添加" : "已保存")) {
			serviceDraft = null;
			current = body.service.name;
			if (isNew) tab = "models";
			render();
		}
	} }, isNew ? "添加" : "保存");
	card.append(form, h("div", { class: "actions" }, submit));
	return card;
}

// one-time-code 让 Chrome 不把网站密码填进密钥框；off 对密码框无效，new-password 会弹出生成密码。
function keyInput(placeholder) {
	return h("input", { class: "input", type: "password", placeholder, autocomplete: "one-time-code", "data-1p-ignore": true, "data-bwignore": true, "data-lpignore": "true" });
}

function renderKey(item) {
	const status = item.status;
	const input = keyInput(status?.keySource ? "已设置，输入新密钥可替换" : "输入密钥");
	const text = status?.keySource === "env" ? `已设置，来自环境变量 ${item.apiKeyEnv}，优先于文件里的密钥` : status?.keySource === "file" ? "已设置，保存在本机文件" : "未设置";
	return h("div", { class: "card" },
		h("h3", {}, "密钥 ", h("span", { class: `pill ${status?.keySource ? "on" : "warn"}`, style: "margin-left:6px" }, text)),
		h("div", { class: "key-row" },
			input,
			h("button", { class: "btn", onclick: async () => { if (input.value.trim()) await run("setKey", { name: item.name, apiKey: input.value }, "密钥已保存"); } }, "保存密钥"),
			h("button", { class: "btn danger", disabled: !status?.keySource || status.keySource === "env" ? true : undefined, onclick: async () => {
				if (confirm("清除文件里保存的密钥？")) await run("setKey", { name: item.name, apiKey: "" }, "密钥已清除");
			} }, "清除"),
		),
		h("div", { class: "hint" }, "密钥只写不读，页面不会显示已保存的密钥。"),
	);
}

function renderDanger(item) {
	return h("div", { class: "card danger" },
		h("h3", {}, "删除服务"),
		h("div", { class: "hint", style: "margin:0 0 12px" }, "服务的密钥和目录缓存会一起删除。"),
		h("button", { class: "btn danger", onclick: async () => {
			if (!confirm(`删除服务 ${item.name}？它的密钥和目录缓存也会删除。`)) return;
			if (await run("removeService", { name: item.name }, "已删除")) {
				parked.delete(item.name);
				serviceDraft = null;
				current = firstService();
				tab = "models";
				openModel = null;
				render();
			}
		} }, "删除服务"),
	);
}

/* ---------- 整页 ---------- */

function render() {
	renderNav();
	const content = $("#content");
	const item = service();
	const parts = [];
	if (state.loadError) parts.push(h("div", { class: "banner err" }, `读取配置失败：${state.loadError}。修好文件后在 pi 里运行 /reload。`));
	if (error) parts.push(h("div", { class: "banner err" }, h("span", { class: "grow" }, error), h("button", { class: "close", style: "color:inherit", onclick: () => { error = null; render(); } }, "×")));
	if (current === "" || (!item && state.services.length === 0)) {
		parts.push(h("div", { class: "head" }, h("div", { class: "info" }, h("h1", {}, "添加服务"),
			h("div", { class: "facts" }, "填好地址和密钥，添加后会自动拉取模型目录，再勾选要启用的模型。"))), renderServiceForm(undefined));
	} else if (item) {
		parts.push(renderHead(item));
		// 刷新失败时页面顶部已经显示了同样的原因，关掉顶部提示后再显示这一条。
		if (item.status?.error && error !== `刷新失败：${item.status.error}`) parts.push(h("div", { class: "banner err" }, `错误：${item.status.error}`));
		if (!item.status?.keySource) {
			parts.push(h("div", { class: "banner warn" }, h("span", { class: "grow" }, "还没有设置密钥，模型不会注册到 pi。"),
				h("button", { class: "btn small", onclick: () => { tab = "settings"; render(); } }, "去设置")));
		}
		parts.push(h("div", { class: "tabs" },
			h("button", { class: `tab${tab === "models" ? " active" : ""}`, onclick: () => { tab = "models"; render(); } }, "模型", h("span", { class: "count" }, item.models.length)),
			h("button", { class: `tab${tab === "settings" ? " active" : ""}`, onclick: () => { tab = "settings"; openModel = null; renderDrawer(); render(); } }, "服务设置"),
		));
		if (tab === "models") parts.push(renderModels(item));
		else parts.push(renderKey(item), renderServiceForm(item), renderDanger(item));
	}
	content.replaceChildren(...parts);
}

$("#add").addEventListener("click", () => { current = ""; openModel = null; error = null; serviceDraft = null; renderDrawer(); render(); });
document.addEventListener("keydown", (event) => {
	if (event.key === "Escape" && openModel) { openModel = null; renderDrawer(); render(); }
});

// 版本号右边的绿色箭头表示 npm 上有新版，点击打开 Release 页面。检查失败时不显示。
async function showVersion() {
	const box = $("#version");
	box.replaceChildren(`v${state.version}`);
	const update = await api("update").catch(() => ({}));
	if (!update.latestVersion) return;
	const title = `有新版本 v${update.latestVersion}`;
	box.append(h("a", { class: "update", href: update.releaseUrl, target: "_blank", rel: "noopener", title, "aria-label": title, html: UPDATE_ICON }));
}

api("state").then((data) => {
	state = data;
	current = firstService();
	render();
	showVersion();
	// 缓存可能已经过时，比如在服务端停用了模型，所以打开页面时在后台刷新一次。
	for (const item of state.services) if (!item.status?.disabled && item.status?.keySource) refreshInBackground(item.name);
}).catch((failure) => {
	$("#content").replaceChildren(h("div", { class: "banner err" }, `${failure.message}。请在 pi 里重新运行 /endpoints。`));
});
</script>
</body>
</html>
